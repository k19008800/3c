# 3cloud 独立 API 域名 vhost — api.unmisa.com（对外 API 网关）
#
# 拓扑：api.<host> 是独立的对外 API 域名，仅代理后端网关（:3000），
#       同时暴露两套 SDK 兼容 base_url（对齐 DeepSeek 用法）：
#
#   OpenAI 客户端    → base_url = https://api.unmisa.com
#                       POST https://api.unmisa.com/v1/chat/completions
#   Anthropic SDK    → base_url = https://api.unmisa.com/anthropic
#                       POST https://api.unmisa.com/anthropic/v1/messages
#
# 部署：把本文件放入宝塔 nginx vhost 目录（/www/server/panel/vhost/nginx/），
#       并确认 DNS：api.unmisa.com → 服务器 IP；证书：api.unmisa.com fullchain/privkey。
# 参考：docs/api-reference.md、docs/ops-guide.md
# 状态：本地已实现并验证（api@3000 直连 + portal@5177 统一入口均可用）

server {
    listen 80;
    server_name api.unmisa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.unmisa.com;

    ssl_certificate /www/server/panel/vhost/cert/api.unmisa.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.unmisa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── OpenAI 兼容入口（base_url = https://api.unmisa.com）──
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Anthropic 兼容入口（base_url = https://api.unmisa.com/anthropic）──
    location /anthropic/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 业务/管理 API（/api/v1/*）──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 健康检查 / 接口文档 ──
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # WebSocket（对话实时通道，如有）
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    access_log /www/wwwlogs/api.unmisa.com.log;
    error_log /www/wwwlogs/api.unmisa.com.error.log;
}
