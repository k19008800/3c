# 3cloud 主站域名 vhost — unmisa.com（Portal + Console 统一入口）
#
# 拓扑（2026-08-18 P3-3 复核，对齐新架构）：
#   浏览器 → Nginx:443 → web-portal (Next.js, 生产 :3100)：
#     - /app/*        → 静态托管 web-console SPA（prepare-app 拷贝 dist → portal/public/app）
#     - /api/* /v1/* /anthropic/*  → rewrite 代理到后端 API (:3000)
#     - 其余页面（首页/定价/模型/博客/状态）→ Next.js SSR
#   API 网关独立域名见 deploy/api.unmisa.com.conf（OpenAI /v1 + Anthropic /anthropic）
#
# 部署：放入宝塔 nginx vhost 目录（/www/server/panel/vhost/nginx/），
#       DNS: unmisa.com + www.unmisa.com → 服务器 IP；证书: unmisa.com fullchain/privkey。
# 参考：docs/ops-guide.md、deploy/deployment-checklist.md

server {
    listen 80;
    server_name unmisa.com www.unmisa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name unmisa.com www.unmisa.com;

    ssl_certificate /www/server/panel/vhost/cert/unmisa.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/unmisa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64m;  # 对齐 API BODY_LIMIT_MB（多模态大 base64）

    # Next.js 静态资源缓存
    location /_next/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1h;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 其余全部 → Next.js（:3100），含 /app/* SPA、/api /v1 /anthropic 的 portal rewrite 代理
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SSL 验证
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/3c/;
    }

    access_log /www/wwwlogs/unmisa.com.log;
    error_log /www/wwwlogs/unmisa.com.error.log;
}
