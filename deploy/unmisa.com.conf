server {
    listen 80;
    server_name unmisa.com www.unmisa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name unmisa.com www.unmisa.com;

    ssl_certificate /www/server/panel/vhost/cert/unmisa.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/unmisa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # API + v1 代理到后端 (3030)
    location /api/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 后台上传文件
    location ^~ /uploads/ {
        alias /www/wwwroot/3c/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SSL 验证
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/3c/web/dist;
    }

    # Web Console (Vite SPA) — 后台/代理/供应商面板
    location /app/ {
        alias /www/wwwroot/3c/web-console/;
        try_files $uri $uri/ /app/index.html;
        index index.html;
    }

    # Next.js 静态资源
    location /_next/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 所有其他请求 → Next.js 官网 (3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    access_log /www/wwwlogs/unmisa.com.log;
    error_log /www/wwwlogs/unmisa.com.error.log;
}
